version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: logistics_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: logistics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data_pipeline/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # FastAPI Backend Service
  backend:
    build: ./backend
    container_name: logistics_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/logistics_db
    depends_on:
      - db

volumes:
  postgres_data: